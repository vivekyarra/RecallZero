name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: recallzero-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-type-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:secrets
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  agent:
    name: python-agent-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run governed policy tests
        working-directory: services/agent
        run: uv run pytest

  browser:
    name: browser-e2e-stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --repeat-each=3
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recallzero-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
